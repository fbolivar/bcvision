name: Build bcOS ISO

on:
  push:
    tags: ['v*']
    paths-ignore: ['src/**', 'public/**', '*.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build-iso:
    name: Build bcOS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            V="${{ inputs.version }}"
            echo "VERSION=${V:-dev}" >> $GITHUB_OUTPUT
            echo "TAG=v${V:-dev}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build Docker image
        run: |
          docker build \
            --tag bcos-builder:${{ steps.ver.outputs.VERSION }} \
            --file bcOS/Dockerfile \
            bcOS/
        timeout-minutes: 30

      - name: Extract ISO from image
        run: |
          mkdir -p output
          # Run container with --privileged to allow any required filesystem ops
          docker run --rm --privileged \
            --volume "$(pwd)/output:/output" \
            bcos-builder:${{ steps.ver.outputs.VERSION }}

      - name: Rename ISO with version
        run: |
          ISO_SRC="output/bcOS-x86_64.iso"
          ISO_DST="output/bcOS-${{ steps.ver.outputs.VERSION }}-x86_64.iso"
          mv "$ISO_SRC" "$ISO_DST"
          echo "ISO_FILE=$ISO_DST" >> $GITHUB_ENV
          echo "ISO_NAME=$(basename $ISO_DST)" >> $GITHUB_ENV
          ls -lh output/

      - name: Generate SHA256
        run: |
          cd output
          sha256sum *.iso > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: bcOS-${{ steps.ver.outputs.VERSION }}
          path: output/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: "bcOS ${{ steps.ver.outputs.VERSION }}"
          body: |
            ## bcOS ${{ steps.ver.outputs.VERSION }} — Syslog Agent Virtual Appliance

            ### Novedades
            - Almacenamiento local en SQLite (365 días en disco, sin costos de Supabase)
            - Solo alertas críticas/altas se sincronizan con BCVision
            - Dashboard web local con historial de eventos
            - Wizard de configuración en 3 pasos

            ### Instalación rápida
            1. Descarga `bcOS-${{ steps.ver.outputs.VERSION }}-x86_64.iso`
            2. Crea una VM: **2 vCPU · 1 GB RAM · 20 GB disco · Red bridged**
            3. Bootea desde la ISO
            4. Accede a `http://<IP-del-appliance>/` en el navegador
            5. Ingresa la URL de BCVision y tu clave API (Ajustes → Agentes bcOS)
            6. Apunta el syslog de tus firewalls a esa IP en el puerto 514

            ### Verificación de integridad
            ```
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            output/*.iso
            output/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
