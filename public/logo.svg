      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tg" x1="92" y1="0" x2="208" y2="0" gradientUnits="userSpaceOnUse">
